<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#iconGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Glowing background effect -->
  <circle cx="256" cy="240" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>

  <!-- Modern House Outline -->
  <path d="M120 250 L256 130 L392 250 L350 250 L350 380 Q350 395 335 395 L177 395 Q162 395 162 380 L162 250 Z" 
        fill="none" 
        stroke="url(#iconGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Piggybank / Growth Coin inside the house -->
  <circle cx="256" cy="290" r="48" fill="url(#accentGrad)" filter="url(#glow)"/>
  <text x="256" y="306" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="#0b101b" text-anchor="middle">$</text>

  <!-- Top Roof Sparkle -->
  <polygon points="256,90 263,110 283,117 263,124 256,144 249,124 229,117 249,110" fill="#fbbf24"/>
</svg>
